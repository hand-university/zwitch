[[permission]]
identifier = "allow-app-commands"
description = "Enables ZWitch custom commands."
commands.allow = [
  "get_auth_state",
  "logout",
  "open_login_window",
  "refresh_user_profile",
  "get_cli_tools_status",
  "get_proxy_enabled",
  "open_external_url",
  "set_cli_tool_config_enabled",
  "set_proxy_enabled",
  "apply_config_injection",
  "get_explore_items",
  "install_marketplace_item",
  "get_marketplace_items",
  "sync_marketplace",
  "set_marketplace_item_enabled",
  "delete_marketplace_item",
  "scan_local_marketplace",
  "get_app_info",
  "check_for_update",
  "get_downloaded_update_info",
  "download_available_update",
  "install_downloaded_update",
  "defer_downloaded_update",
  "get_usage_summary",
  "clear_usage",
]
